version: '3.8'

services:
  db:
    image: postgres:15
    container_name: xaalisi_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: xaalisi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: xaalisi_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: xaalisi_backend
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/xaalisi_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=xaalisi_super_secret_key_prod_only
      - ENCRYPTION_KEY=DUMMY_KEY_FOR_DEV_REPLACE_ME_LATER==
      - ENVIRONMENT=production
      - ORANGE_MONEY_API_KEY=your_production_api_key
      - ORANGE_MONEY_SECRET=your_production_secret
      - USSD_API_KEY=your_production_ussd_key
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: xaalisi_gateway
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
